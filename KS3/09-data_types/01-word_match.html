<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Data Types — Matching Exercise</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:#ffffff; color:#1b1f2a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
.wrap{ max-width:900px; margin:0 auto; padding:14px; }
.topbar{
  display:flex; align-items:center; gap:8px; background:#eef0f5; border:0.5px solid #d7dbe4;
  border-radius:10px 10px 0 0; padding:9px 12px; font-size:13px; font-weight:600;
}
.topbar i{ color:#2563eb; font-size:16px; }
.body-area{
  border:0.5px solid #d7dbe4; border-top:none; border-radius:0 0 10px 10px; background:#ffffff; padding:16px;
}
.instructions{ font-size:13px; color:#6b7280; margin:0 0 14px; }
table{ width:100%; border-collapse:collapse; font-size:14px; table-layout:fixed; }
col.type-col{ width:16%; }
col.data-col{ width:42%; }
thead th{
  text-align:left; padding:8px 10px; border:0.5px solid #d7dbe4; background:#f6f7fa; font-weight:600;
}
th.desc-head{ color:#b3261e; }
th.ex-head{ color:#1a56db; }
td.type-cell{ padding:8px 10px; border:0.5px solid #d7dbe4; font-weight:600; background:#fafbfc; }
td.dz{ padding:6px; border:0.5px solid #d7dbe4; min-height:40px; background:#fafbfc; transition:outline .15s; }
#bank{
  display:flex; flex-wrap:wrap; gap:8px; min-height:44px; margin-top:14px; padding:10px;
  border:1.5px dashed #d7dbe4; border-radius:8px; background:#fbfbfc;
}
.card{
  padding:7px 11px; border-radius:8px; font-size:13px; line-height:1.4; cursor:grab;
  user-select:none; touch-action:none; max-width:260px;
}
.card.desc{ border:0.5px solid #f0b4ae; background:#fdecea; color:#b3261e; }
.card.ex{ border:0.5px solid #a9c6f7; background:#eaf1fd; color:#1a56db; }
.btn-row{ display:flex; gap:8px; margin-top:16px; }
button{
  border:0.5px solid #d7dbe4; background:#ffffff; color:#1b1f2a; border-radius:8px;
  padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
}
button:hover{ border-color:#2563eb; color:#2563eb; }
#checkBtn{ border-color:#2563eb; background:#eaf1fd; color:#1a56db; }
#feedback{ font-size:13px; margin-top:10px; min-height:18px; font-weight:600; }
</style>
</head>
<body>

<div class="wrap" id="widgetRoot">
  <div class="topbar"><i class="ti" aria-hidden="true">&#9635;</i>Data Types — Matching Exercise</div>
  <div class="body-area">
    <p class="instructions">Drag each card below into the row it belongs to.</p>
    <table>
      <colgroup><col class="type-col"><col class="data-col"><col class="data-col"></colgroup>
      <thead>
        <tr>
          <th>Data type</th>
          <th class="desc-head">Description</th>
          <th class="ex-head">Examples</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="bank"></div>
    <div class="btn-row">
      <button id="checkBtn">Check answers</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="feedback"></div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   EXERCISE CONTENT
   ------------------------------------------------------------
   Recreates the data-types matching exercise from Andy's old
   Flash tool (screenshot supplied in chat) — five data types,
   each with a description card and an examples card to drag
   into place. "Real" renamed to "Real / Float" per Andy's
   follow-up edit to the approved mockup.

   Kept as a clearly separate data array (not hardcoded into the
   HTML/logic below) specifically so this same engine could be
   reused for a different matching exercise later, just by
   swapping this array — same spirit as the Code Editor family's
   CHALLENGE_TITLE/STARTER_CODE separation.
   ============================================================ */
var rows = [
  { type: "Integer", desc: "Whole numbers, positive or negative", ex: "42, -11, 0" },
  { type: "Real / Float", desc: "Numbers, including fractions or decimal", ex: "12.9, -17.50, 28.0" },
  { type: "Boolean", desc: "True or False", ex: "True or False" },
  { type: "Character", desc: "A single letter, digit, space, punctuation mark or symbol, written in quotation marks", ex: "'A', 'b', '7', '?'" },
  { type: "String", desc: "More than one letter, number, space, punctuation mark or symbol, written in quotation marks", ex: "'computer science', 'New York 10304'" }
];

/* ============================================================
   BUILD THE TABLE + WORD BANK
   ------------------------------------------------------------
   Cards are deliberately SHUFFLED, not shown in the same order
   as the answer table — a pre-sorted matching exercise wouldn't
   actually test anything. Confirmed this reads correctly against
   the approved mockup before this file was built.
   ============================================================ */
var cards = [];
rows.forEach(function (r, i) {
  cards.push({ id: "d" + i, row: i, col: "desc", text: r.desc });
  cards.push({ id: "e" + i, row: i, col: "ex", text: r.ex });
});
for (var i = cards.length - 1; i > 0; i--) {
  var j = Math.floor(Math.random() * (i + 1));
  var t = cards[i]; cards[i] = cards[j]; cards[j] = t;
}

var tbody = document.getElementById("tbody");
var bank = document.getElementById("bank");
var feedback = document.getElementById("feedback");

rows.forEach(function (r, i) {
  var tr = document.createElement("tr");
  var typeTd = document.createElement("td");
  typeTd.className = "type-cell";
  typeTd.textContent = r.type;
  var descTd = document.createElement("td");
  descTd.className = "dz";
  descTd.dataset.row = i; descTd.dataset.col = "desc";
  var exTd = document.createElement("td");
  exTd.className = "dz";
  exTd.dataset.row = i; exTd.dataset.col = "ex";
  tr.appendChild(typeTd); tr.appendChild(descTd); tr.appendChild(exTd);
  tbody.appendChild(tr);
});

function makeCard(c) {
  var el = document.createElement("div");
  el.className = "card " + c.col;
  el.dataset.id = c.id;
  el.textContent = c.text;
  return el;
}
cards.forEach(function (c) { bank.appendChild(makeCard(c)); });

/* ============================================================
   DRAG AND DROP — pointer events, not the native HTML5 Drag and
   Drop API. Native DnD has genuinely poor/inconsistent touch
   support across mobile browsers, which matters here since this
   widget needs to work for students on tablets/phones, not just
   desktop mice. Pointer events (pointerdown/move/up) work
   identically for mouse, touch, and pen with one code path.

   Behaviour, matching what was approved in the chat mockup:
   - Dropping on an EMPTY, matching-column dropzone places the
     card there.
   - Dropping on an OCCUPIED dropzone bounces the existing card
     back to the word bank first, then places the new one — a
     swap, not a rejected drop.
   - Dropping outside any valid dropzone (or on the wrong column
     — a description card over an Examples cell, say) returns the
     card to the word bank.
   - Cards already placed can be dragged back out to the bank, or
     directly into a different cell.
   ============================================================ */
var dragEl = null, dragId = null, offX = 0, offY = 0;

function onDown(e) {
  var card = e.target.closest(".card");
  if (!card) return;
  dragEl = card; dragId = card.dataset.id;
  var rect = card.getBoundingClientRect();
  offX = e.clientX - rect.left; offY = e.clientY - rect.top;
  card.style.position = "fixed";
  card.style.zIndex = 1000;
  card.style.width = rect.width + "px";
  card.style.left = rect.left + "px";
  card.style.top = rect.top + "px";
  document.body.appendChild(card);
  card.setPointerCapture(e.pointerId);
}
function onMove(e) {
  if (!dragEl) return;
  dragEl.style.left = (e.clientX - offX) + "px";
  dragEl.style.top = (e.clientY - offY) + "px";
}
function onUp(e) {
  if (!dragEl) return;
  dragEl.style.position = ""; dragEl.style.zIndex = ""; dragEl.style.left = ""; dragEl.style.top = ""; dragEl.style.width = "";
  var below = document.elementFromPoint(e.clientX, e.clientY);
  var zone = below ? below.closest(".dz") : null;
  var card = cards.filter(function (c) { return c.id === dragId; })[0];
  if (zone && zone.dataset.col === card.col) {
    var existing = zone.querySelector(".card");
    if (existing) bank.appendChild(existing);
    zone.style.outline = "";
    zone.appendChild(dragEl);
  } else {
    bank.appendChild(dragEl);
  }
  dragEl = null; dragId = null;
  feedback.textContent = "";
  sendHeightIfChanged();
}
document.addEventListener("pointerdown", onDown);
document.addEventListener("pointermove", onMove);
document.addEventListener("pointerup", onUp);

document.getElementById("checkBtn").addEventListener("click", function () {
  var total = rows.length * 2;
  var correct = 0;
  document.querySelectorAll(".dz").forEach(function (zone) {
    var cardEl = zone.querySelector(".card");
    zone.style.outline = "";
    if (!cardEl) return;
    var cardData = cards.filter(function (c) { return c.id === cardEl.dataset.id; })[0];
    var isCorrect = String(cardData.row) === zone.dataset.row && cardData.col === zone.dataset.col;
    if (isCorrect) {
      correct++;
      zone.style.outline = "2px solid #2f9e44";
    } else {
      zone.style.outline = "2px solid #d9363e";
    }
  });
  feedback.textContent = correct + " of " + total + " correct.";
  feedback.style.color = correct === total ? "#2f9e44" : "#1b1f2a";
});

document.getElementById("resetBtn").addEventListener("click", function () {
  document.querySelectorAll(".dz .card").forEach(function (c) { bank.appendChild(c); });
  document.querySelectorAll(".dz").forEach(function (z) { z.style.outline = ""; });
  feedback.textContent = "";
  sendHeightIfChanged();
});

/* ============================================================
   AUTO-RESIZE (same mechanism as the other J277 widgets) — the
   Weebly Footer Code listener already set up site-wide picks
   this up automatically, nothing extra needed there. Explicitly
   re-triggered after drag/reset actions above, since this
   widget's height can genuinely change as the word bank empties
   or refills (unlike the code widgets, where content height is
   comparatively stable).
   ============================================================ */
var PAGE_ID = (function () {
  try {
    var path = window.location.pathname || "default";
    return path.replace(/[^a-zA-Z0-9_-]/g, "_") || "default";
  } catch (e) { return "default"; }
})();

var lastSentHeight = 0;
function currentHeight() {
  return Math.ceil(document.getElementById("widgetRoot").getBoundingClientRect().height);
}
function postHeight(h) {
  try {
    window.parent.postMessage({ source: "j277-code-widget", pageId: PAGE_ID, height: h }, "*");
  } catch (e) {}
}
function sendHeightIfChanged() {
  var h = currentHeight();
  if (h === lastSentHeight) return;
  lastSentHeight = h;
  postHeight(h);
}
if (window.ResizeObserver) {
  new ResizeObserver(function () { sendHeightIfChanged(); }).observe(document.getElementById("widgetRoot"));
} else {
  setInterval(sendHeightIfChanged, 500);
}
window.addEventListener("resize", sendHeightIfChanged);
var retries = 0;
var retryTimer = setInterval(function () {
  var h = currentHeight();
  lastSentHeight = h;
  postHeight(h);
  retries++;
  if (retries >= 20) clearInterval(retryTimer);
}, 1000);
</script>
</body>
</html>
